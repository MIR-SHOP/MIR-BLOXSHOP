
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIR BLOX SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0712;color:white;font-family:Arial;padding-bottom:30px}
header{text-align:center;padding:25px;background:#190e27;border-bottom:2px solid #70449a}
header h1{color:#d9a7ff;margin:0}
main{max-width:850px;margin:auto;padding:15px}
.panel{background:#160f20;border:1px solid #50316a;border-radius:15px;padding:15px;margin:15px 0}
h2{color:#dfb5ff}
button{background:#873ec0;color:white;border:0;padding:12px;border-radius:10px;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#21172e;color:white;border:1px solid #634181;border-radius:9px}
.payment-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay-card{background:#241532;border:2px solid #593477;border-radius:14px;padding:14px 5px;text-align:center;cursor:pointer}
.pay-card img{width:55px;height:55px;object-fit:contain;display:block;margin:auto auto 8px}
.pay-card.selected{border-color:#d18aff;background:#512477;box-shadow:0 0 12px #a855f7}
</style>
</head>
<body>
<header>
<h1>🍇 MIR BLOX SHOP</h1>
<p>متجر فواكه Blox Fruits</p>
</header>
<main>
<section class="panel">
<h2>💳 طرق الدفع</h2>
<div class="payment-options">
<div class="pay-card" onclick="choosePay(this,'Robux')">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Robux_2019_Logo.svg">
<b>Robux</b>
</div>
<div class="pay-card" onclick="choosePay(this,'ليبيانا')">
<img src="https://www.libyana.ly/favicon.ico">
<b>ليبيانا</b>
</div>
<div class="pay-card" onclick="choosePay(this,'المدار')">
<img src="https://almadar.ly/favicon.ico">
<b>المدار</b>
</div>
</div>
<input type="hidden" id="paymentMethod">
</section>
</main>
  
<style>
#products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.product{
 background:#21172e;
 border:1px solid #70449a;
 border-radius:14px;
 padding:10px;
 text-align:center;
}
.product img{
 width:100%;
 height:125px;
 object-fit:contain;
}
.product h3{color:#e2baff;font-size:15px}
.product p{color:white}
.product button{
 width:100%;
 padding:10px;
 border:0;
 border-radius:9px;
 background:#873bd1;
 color:white;
}
#cartItems{margin:12px 0}
</style>

<h2>🍇 جميع فواكه Blox Fruits</h2>
<p>اختار فاكهتك | Choose your fruit</p>
<div id="products"></div>

<div class="panel" id="cartPanel">
<h2>🛒 سلة المشتريات</h2>
<div id="cartItems">السلة فارغة</div>
<h3>المجموع: <span id="total">0</span></h3>
</div>

<script>
const fruitNames=[
["Rocket","روكيت"],["Spin","سبين"],
["Blade","بليد"],["Spring","سبرينغ"],
["Bomb","بومب"],["Smoke","سموك"],
["Spike","سبايك"],["Flame","فليم"],
["Ice","آيس"],["Sand","ساند"],
["Dark","دارك"],["Eagle","إيغل"],
["Diamond","دايموند"],["Light","لايت"],
["Rubber","ربر"],["Ghost","غوست"],
["Magma","ماغما"],["Quake","كويك"],
["Buddha","بوذا"],["Love","لاف"],
["Creation","كرييشن"],["Spider","سبايدر"],
["Sound","ساوند"],["Phoenix","فونيكس"],
["Portal","بورتال"],["Lightning","لايتنينغ"],
["Pain","بين"],["Blizzard","بليزارد"],
["Gravity","جرافيتي"],["Mammoth","ماموث"],
["T-Rex","تي ريكس"],["Dough","دو"],
["Shadow","شادو"],["Venom","فينوم"],
["Gas","غاز"],["Spirit","سبيريت"],
["Tiger","تايغر"],["Yeti","ييتي"],
["Magnet","ماغنيت"],["Kitsune","كيتسوني"],
["Control","كنترول"],["Dragon","دراجون"]
];

const cart={};
const prices=fruitNames.map(()=>0);
const stocks=fruitNames.map(()=>10);

const imageFiles={
"Blade":"Chop",
"Eagle":"Falcon",
"Lightning":"Rumble",
"Tiger":"Leopard",
"Creation":"Creation"
};

function fruitImage(name){
 let file=imageFiles[name]||name;
 return "https://blox-fruits.com/wp-content/uploads/2023/10/"+file+"-Fruit-Blox-Fruits.webp";
}

function showFruits(){
 document.getElementById("products").innerHTML=
 fruitNames.map((f,i)=>`
 <div class="product">
  <img src="${fruitImage(f[0])}"
   alt="${f[0]}"
   loading="lazy"
   onerror="this.onerror=null;this.src='https://placehold.co/200x150/21172e/ffffff?text=${f[0]}'">
  <h3>${f[1]} | ${f[0]}</h3>
  <p>السعر: ${prices[i]||"يحدد لاحقاً"}</p>
  <p>${stocks[i]>0?"متوفر":"نفدت الكمية"}</p>
  <button ${stocks[i]===0?"disabled":""}
   onclick="addFruit(${i})">
   أضف للسلة
  </button>
 </div>
 `).join("");
}

function addFruit(i){
 if((cart[i]||0)>=stocks[i]){
  alert("الكمية غير متوفرة");
  return;
 }
 cart[i]=(cart[i]||0)+1;
 showCart();
}

function deleteFruit(i){
 delete cart[i];
 showCart();
}

function showCart(){
 let total=0;
 let html="";
 Object.keys(cart).forEach(i=>{
  let f=fruitNames[i];
  let sum=prices[i]*cart[i];
  total+=sum;
  html+=`
  <div style="padding:10px;border-bottom:1px solid #70449a">
   ${f[1]} | ${f[0]} × ${cart[i]}
   <button onclick="deleteFruit(${i})">حذف</button>
  </div>`;
 });
 document.getElementById("cartItems").innerHTML=
 html||"السلة فارغة | Cart is empty";
 document.getElementById("total").textContent=total;
}

showFruits();
showCart();
</script>
  
</body>
</html>
