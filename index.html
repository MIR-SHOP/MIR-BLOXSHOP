
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIR BLOX SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0712;color:white;font-family:Arial;padding-bottom:30px}
header{text-align:center;padding:25px;background:#190e27;border-bottom:2px solid #70449a}
header h1{color:#d9a7ff;margin:0}
main{max-width:850px;margin:auto;padding:15px}
.panel{background:#160f20;border:1px solid #50316a;border-radius:15px;padding:15px;margin:15px 0}
h2{color:#dfb5ff}
button{background:#873ec0;color:white;border:0;padding:12px;border-radius:10px;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#21172e;color:white;border:1px solid #634181;border-radius:9px}
.payment-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pay-card{background:#241532;border:2px solid #593477;border-radius:14px;padding:14px 5px;text-align:center;cursor:pointer}
.pay-card img{width:55px;height:55px;object-fit:contain;display:block;margin:auto auto 8px}
.pay-card.selected{border-color:#d18aff;background:#512477;box-shadow:0 0 12px #a855f7}
</style>
</head>
<body>
<header>
<h1>🍇 MIR BLOX SHOP</h1>
<p>متجر فواكه Blox Fruits</p>
</header>
<main>
<section class="panel">
<h2>💳 طرق الدفع</h2>
<div class="payment-options">
<div class="pay-card" onclick="choosePay(this,'Robux')">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Robux_2019_Logo.svg">
<b>Robux</b>
</div>
<div class="pay-card" onclick="choosePay(this,'ليبيانا')">
<img src="https://www.libyana.ly/favicon.ico">
<b>ليبيانا</b>
</div>
<div class="pay-card" onclick="choosePay(this,'المدار')">
<img src="https://almadar.ly/favicon.ico">
<b>المدار</b>
</div>
</div>
<input type="hidden" id="paymentMethod">
</section>
</main>
</body>
</html>
