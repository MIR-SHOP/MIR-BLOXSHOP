<style>

<script>
const fruits = [
["روكيت","Rocket","🚀",25,5],
["سبين","Spin","🌀",100,5],
["بليد","Blade","⚔️",100,5],
["سبرينغ","Spring","🌸",100,5],
["بومب","Bomb","💣",100,5],
["سموك","Smoke","☁️",100,5],
["سبايك","Spike","🌵",100,5],
["فليم","Flame","🔥",100,5],
["إيغل","Eagle","🦅",100,5],
["آيس","Ice","🧊",100,5],
["ساند","Sand","🏜️",100,5],
["دارك","Dark","🌑",100,5],
["دايموند","Diamond","💎",100,5],
["لايت","Light","✨",100,5],
["ربر","Rubber","🟣",100,5],
["غوست","Ghost","👻",100,5],
["ماغما","Magma","🌋",100,5],
["كويك","Quake","🌊",100,5],
["بوذا","Buddha","🧘",100,5],
["لوف","Love","💗",100,5],
["كرييشن","Creation","🛡️",100,5],
["سبايدر","Spider","🕸️",100,5],
["ساوند","Sound","🎵",100,5],
["فونيكس","Phoenix","🔥",100,5],
["بورتال","Portal","🌀",1000,1],
["لايتنينغ","Lightning","⚡",1050,2],
["باين","Pain","💥",1100,2],
["بليزارد","Blizzard","❄️",1125,0],
["جرافيتي","Gravity","🌌",1150,1],
["ماموث","Mammoth","🦣",1175,2],
["تيريكس","T-Rex","🦖",1175,3],
["دو","Dough","🍩",1200,3],
["شادو","Shadow","🌑",1200,2],
["فينوم","Venom","🐍",0,0],
["غاز","Gas","💨",1250,0],
["سبيريت","Spirit","👻",1275,2],
["تايغر","Tiger","🐅",1500,1],
["يتي","Yeti","⛄",1500,0],
["ماغنيت","Magnet","🧲",1250,0],
["كيتسوني","Kitsune","🦊",2000,2],
["كونترول","Control","🎮",2000,0],
["دراجون شرقي","Dragon (East)","🐉",2500,0],
["دراجون غربي","Dragon (West)","🐉",2500,0]
];

let cart = {};
let quantities = {};

function renderProducts(){
 const area=document.getElementById("products");
 const search=document.getElementById("search").value.toLowerCase();
 area.innerHTML="";

 fruits.forEach((f,i)=>{
  if(!f[0].toLowerCase().includes(search) &&
     !f[1].toLowerCase().includes(search)) return;

  const sold=f[4]<=0;
  const qty=quantities[i]||1;

  area.innerHTML+=`
   <div class="card">
    <div style="font-size:55px">${f[2]}</div>
    <h3>${f[0]}</h3>
    <p>${f[1]}</p>
    <p class="price">${f[3]} Robux</p>
    <p class="${sold?'out':'stock'}">
     ${sold?'نفدت الكمية':'متوفرة'}
    </p>
    <div class="qty">
     <button onclick="changeQty(${i},-1)" ${sold?'disabled':''}>−</button>
     <b>${qty}</b>
     <button onclick="changeQty(${i},1)" ${sold?'disabled':''}>+</button>
    </div>
    <button onclick="addCart(${i})" ${sold?'disabled':''}>
     أضف للسلة
    </button>
   </div>`;
 });
}

function changeQty(i,n){
 quantities[i]=Math.max(1,(quantities[i]||1)+n);
 renderProducts();
}

function addCart(i){
 const f=fruits[i];
 const amount=quantities[i]||1;

 if((cart[i]||0)+amount>f[4]){
  alert("عذراً، الكمية المطلوبة غير متوفرة!\nSorry, requested quantity is unavailable!");
  return;
 }

 cart[i]=(cart[i]||0)+amount;
 renderCart();

 showAddToast(f[0]);
 }
 
<body>

<header>
<h1>👑 MIR BLOX SHOP</h1>
<p>متجرك الأول لفواكه Blox Fruits</p>
</header>

<div class="container">
<input id="search" placeholder="🔎 ابحث عن فاكهة...">
<div class="products" id="products"></div>

<div class="panel">
<h2>🛒 سلة طلبك</h2>
<div id="cartItems">السلة فارغة</div>
<h3 id="total">المجموع: 0 Robux</h3>
</div>
</div>
 
<script>
function renderCart(){
 const area=document.getElementById("cartItems");
 const ids=Object.keys(cart);

 if(ids.length===0){
  area.innerHTML="السلة فارغة";
  document.getElementById("total").textContent="المجموع: 0 Robux";
  return;
 }

 let total=0;
 area.innerHTML="";

 ids.forEach(id=>{
  const i=Number(id);
  const f=fruits[i];
  const count=cart[i];
  const price=f[3]*count;
  total+=price;

  area.innerHTML+=`
   <div style="border-bottom:1px solid #63358a;padding:10px">
    <b>${f[0]}</b>
    <p>${count} × ${f[3]} = ${price} Robux</p>
    <button onclick="removeCart(${i})">حذف</button>
   </div>`;
 });

 document.getElementById("total").textContent=
 "المجموع: "+total+" Robux";
}

function removeCart(i){
 delete cart[i];
 renderCart();
}

document.getElementById("search").addEventListener("input",renderProducts);

renderProducts();
renderCart();
</script>
 
<div class="panel">
 <h2>📦 تأكيد الطلب</h2>

 <input id="robloxName"
 placeholder="اكتب اسمك في Roblox">

 تأكيد الطلب

<script>
function placeOrder(){
 const roblox=document.getElementById("robloxName").value.trim();
 const tiktok=document.getElementById("tiktokName").value.trim();

 if(!roblox || !tiktok){
  alert("اكتب اسم Roblox وTikTok أولاً");
  return;
 }

 if(Object.keys(cart).length===0){
  alert("السلة فارغة!");
  return;
 }

 let message="طلب جديد من MIR BLOX SHOP\n";
 message+="Roblox: "+roblox+"\n";
 message+="TikTok: "+tiktok+"\n\n";

 let total=0;

 Object.keys(cart).forEach(id=>{
  const f=fruits[Number(id)];
  const count=cart[id];
  message+=f[0]+" × "+count+"\n";
  total+=f[3]*count;
 });

 message+="\nالمجموع: "+total+" Robux";

 const url="https://www.tiktok.com/@justrynianbrian1";

 alert("تم تجهيز طلبك! تواصل معنا عبر حساب المتجر لإرساله.");

 window.open(url,"_blank");
}
</script>

<div id="reviewPopup">
 <div class="reviewBox">
  <h2>⭐ قيّم تجربتك معنا</h2>
  <p>كيف كانت تجربتك؟</p>
  <h3>Rate your experience!</h3>

  <div class="reviewStars">
   <span onclick="chooseStar(1)">★</span>
   <span onclick="chooseStar(2)">★</span>
   <span onclick="chooseStar(3)">★</span>
   <span onclick="chooseStar(4)">★</span>
   <span onclick="chooseStar(5)">★</span>
  </div>

  <input id="reviewName"
   placeholder="اسمك (اختياري) / Name (optional)">

  <textarea id="reviewText" rows="3"
   placeholder="اكتب رأيك هنا / Write your review"></textarea>

  <button id="sendReview" onclick="submitReview()">
   إرسال التقييم / Submit
  </button>

  <button id="skipReview" onclick="closeReview()">
   تخطي / Skip
  </button>
 </div>
</div>

<script>
let selectedStars = 0;

function openReview(){
 selectedStars = 0;
 document.querySelectorAll(".reviewStars span")
  .forEach(s=>s.classList.remove("active"));

 document.getElementById("reviewName").value="";
 document.getElementById("reviewText").value="";
 document.getElementById("reviewPopup").style.display="flex";
}

function chooseStar(n){
 selectedStars=n;
 document.querySelectorAll(".reviewStars span")
  .forEach((s,i)=>{
   s.classList.toggle("active",i<n);
  });
}

function submitReview(){
 if(selectedStars===0){
  alert("اختر عدد النجوم أولاً!\nPlease select your stars!");
  return;
 }

 const review={
  name:document.getElementById("reviewName").value.trim() || "زائر",
  stars:selectedStars,
  text:document.getElementById("reviewText").value.trim(),
  date:new Date().toLocaleDateString()
 };

 let reviews=JSON.parse(localStorage.getItem("mirReviews")||"[]");
 reviews.push(review);
 localStorage.setItem("mirReviews",JSON.stringify(reviews));

 alert("شكراً على تقييمك! ❤️\nThank you for your review!");
 closeReview();
}

function closeReview(){
 document.getElementById("reviewPopup").style.display="none";
}
</script>
 

<script>
function addReview(){
 const rating=document.getElementById("rating").value;
 const name=document.getElementById("reviewName").value.trim()||"زائر";
 const comment=document.getElementById("reviewText").value.trim();

 if(!comment){
  alert("اكتب تعليقك أولاً");
  return;
 }

 const reviews=document.getElementById("reviews");
 const item=document.createElement("div");
 item.style.padding="10px";
 item.style.borderBottom="1px solid #63358a";

 const stars=document.createElement("div");
 stars.textContent="⭐".repeat(Number(rating));

 const author=document.createElement("b");
 author.textContent=name;

 const text=document.createElement("p");
 text.textContent=comment;

 item.append(stars,author,text);
 reviews.prepend(item);

 document.getElementById("reviewText").value="";
 alert("شكراً على تقييمك ❤️");
}
</script>
