
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR BLOX SHOP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0712;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:25px 10px;
 background:linear-gradient(135deg,#240b42,#10091b);
 border-bottom:2px solid #9b45ff;
}
header h1{color:#c58aff;margin:0}
header p{color:#ddd}
.container{padding:15px;max-width:1100px;margin:auto}
input,button{
 font-family:Arial;
 border:0;
 border-radius:10px;
 padding:12px;
}
input{
 width:100%;
 background:#21172e;
 color:white;
 margin:7px 0;
}
button{
 background:#8b35d9;
 color:white;
 cursor:pointer;
}
button:disabled{background:#555;cursor:not-allowed}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:12px;
}
.card{
 background:#191124;
 border:1px solid #63358a;
 border-radius:14px;
 padding:12px;
 text-align:center;
}
.card img{
 width:100%;
 height:105px;
 object-fit:contain;
}
.card h3{margin:8px 0}
.price{color:#d6a4ff}
.stock{color:#8ee6a5}
.out{color:#ff7777}
.qty{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:12px;
 margin:10px 0;
}
.qty button{padding:7px 13px}
.panel{
 background:#191124;
 border:1px solid #63358a;
 border-radius:14px;
 padding:15px;
 margin-top:20px;
}
h2{color:#c58aff}
</style>
</head>
<body>

<header>
<h1>👑 MIR BLOX SHOP</h1>
<p>متجرك الأول لفواكه Blox Fruits</p>
</header>

<div class="container">
<input id="search" placeholder="🔎 ابحث عن فاكهة...">
<div class="products" id="products"></div>

<div class="panel">
<h2>🛒 سلة طلبك</h2>
<div id="cartItems">السلة فارغة</div>
<h3 id="total">المجموع: 0 Robux</h3>
</div>
</div>
 
<script>
const fruits = [
["روكيت","Rocket","🚀",25,5],
["سبين","Spin","🌀",100,5],
["بليد","Blade","⚔️",100,5],
["سبرينغ","Spring","🌸",100,5],
["بومب","Bomb","💣",100,5],
["سموك","Smoke","☁️",100,5],
["سبايك","Spike","🌵",100,5],
["فليم","Flame","🔥",100,5],
["إيغل","Eagle","🦅",100,5],
["آيس","Ice","🧊",100,5],
["ساند","Sand","🏜️",100,5],
["دارك","Dark","🌑",100,5],
["دايموند","Diamond","💎",100,5],
["لايت","Light","✨",100,5],
["ربر","Rubber","🟣",100,5],
["غوست","Ghost","👻",100,5],
["ماغما","Magma","🌋",100,5],
["كويك","Quake","🌊",100,5],
["بوذا","Buddha","🧘",100,5],
["لوف","Love","💗",100,5],
["كرييشن","Creation","🛡️",100,5],
["سبايدر","Spider","🕸️",100,5],
["ساوند","Sound","🎵",100,5],
["فونيكس","Phoenix","🔥",100,5],
["بورتال","Portal","🌀",1000,1],
["لايتنينغ","Lightning","⚡",1050,2],
["باين","Pain","💥",1100,2],
["بليزارد","Blizzard","❄️",1125,0],
["جرافيتي","Gravity","🌌",1150,1],
["ماموث","Mammoth","🦣",1175,2],
["تيريكس","T-Rex","🦖",1175,3],
["دو","Dough","🍩",1200,3],
["شادو","Shadow","🌑",1200,2],
["فينوم","Venom","🐍",0,0],
["غاز","Gas","💨",1250,0],
["سبيريت","Spirit","👻",1275,2],
["تايغر","Tiger","🐅",1500,1],
["يتي","Yeti","⛄",1500,0],
["ماغنيت","Magnet","🧲",1250,0],
["كيتسوني","Kitsune","🦊",2000,2],
["كونترول","Control","🎮",2000,0],
["دراجون شرقي","Dragon (East)","🐉",2500,0],
["دراجون غربي","Dragon (West)","🐉",2500,0]
];

let cart = {};
let quantities = {};

function renderProducts(){
 const area=document.getElementById("products");
 const search=document.getElementById("search").value.toLowerCase();
 area.innerHTML="";

 fruits.forEach((f,i)=>{
  if(!f[0].toLowerCase().includes(search) &&
     !f[1].toLowerCase().includes(search)) return;

  const sold=f[4]<=0;
  const qty=quantities[i]||1;

  area.innerHTML+=`
   <div class="card">
    <div style="font-size:55px">${f[2]}</div>
    <h3>${f[0]}</h3>
    <p>${f[1]}</p>
    <p class="price">${f[3]} Robux</p>
    <p class="${sold?'out':'stock'}">
     ${sold?'نفدت الكمية':'متوفرة'}
    </p>
    <div class="qty">
     <button onclick="changeQty(${i},-1)" ${sold?'disabled':''}>−</button>
     <b>${qty}</b>
     <button onclick="changeQty(${i},1)" ${sold?'disabled':''}>+</button>
    </div>
    <button onclick="addCart(${i})" ${sold?'disabled':''}>
     أضف للسلة
    </button>
   </div>`;
 });
}

function changeQty(i,n){
 quantities[i]=Math.max(1,(quantities[i]||1)+n);
 renderProducts();
}

function addCart(i){
 const f=fruits[i];
 const amount=quantities[i]||1;

 if((cart[i]||0)+amount>f[4]){
  alert("عذراً، الكمية المطلوبة غير متوفرة!");
  return;
 }

 cart[i]=(cart[i]||0)+amount;
 renderCart();
}
</script>
 
<script>
function renderCart(){
 const area=document.getElementById("cartItems");
 const ids=Object.keys(cart);

 if(ids.length===0){
  area.innerHTML="السلة فارغة";
  document.getElementById("total").textContent="المجموع: 0 Robux";
  return;
 }

 let total=0;
 area.innerHTML="";

 ids.forEach(id=>{
  const i=Number(id);
  const f=fruits[i];
  const count=cart[i];
  const price=f[3]*count;
  total+=price;

  area.innerHTML+=`
   <div style="border-bottom:1px solid #63358a;padding:10px">
    <b>${f[0]}</b>
    <p>${count} × ${f[3]} = ${price} Robux</p>
    <button onclick="removeCart(${i})">حذف</button>
   </div>`;
 });

 document.getElementById("total").textContent=
 "المجموع: "+total+" Robux";
}

function removeCart(i){
 delete cart[i];
 renderCart();
}

document.getElementById("search").addEventListener("input",renderProducts);

renderProducts();
renderCart();
</script>
 
<div class="panel">
 <h2>📦 تأكيد الطلب</h2>

 <input id="robloxName"
 placeholder="اكتب اسمك في Roblox">

 <input id="tiktokName"
 placeholder="اكتب اسمك في TikTok">

 <button onclick="placeOrder()">
 تأكيد الطلب
 </button>

 <p>بعد تأكيد الطلب تواصل معنا عبر تيك توك.</p>
</div>

<script>
function placeOrder(){
 const roblox=document.getElementById("robloxName").value.trim();
 const tiktok=document.getElementById("tiktokName").value.trim();

 if(!roblox || !tiktok){
  alert("اكتب اسم Roblox وTikTok أولاً");
  return;
 }

 if(Object.keys(cart).length===0){
  alert("السلة فارغة!");
  return;
 }

 let message="طلب جديد من MIR BLOX SHOP\n";
 message+="Roblox: "+roblox+"\n";
 message+="TikTok: "+tiktok+"\n\n";

 let total=0;

 Object.keys(cart).forEach(id=>{
  const f=fruits[Number(id)];
  const count=cart[id];
  message+=f[0]+" × "+count+"\n";
  total+=f[3]*count;
 });

 message+="\nالمجموع: "+total+" Robux";

 const url="https://www.tiktok.com/@justrynianbrian1";

 alert("تم تجهيز طلبك! تواصل معنا عبر حساب المتجر لإرساله.");

 window.open(url,"_blank");
}
</script>
 
<div class="panel">
 <h2>⭐ قيّم تجربتك</h2>

 <p>اختار تقييمك للمتجر:</p>

 <select id="rating" style="width:100%;padding:12px;border-radius:10px;background:#21172e;color:white">
  <option value="5">⭐⭐⭐⭐⭐ ممتاز</option>
  <option value="4">⭐⭐⭐⭐ جيد جداً</option>
  <option value="3">⭐⭐⭐ جيد</option>
  <option value="2">⭐⭐ مقبول</option>
  <option value="1">⭐ يحتاج تحسين</option>
 </select>

 <input id="reviewName" placeholder="اسمك (اختياري)">

 <input id="reviewText" placeholder="اكتب تعليقك هنا">

 <button onclick="addReview()">إرسال التقييم</button>

 <div id="reviews"></div>
</div>

<script>
function addReview(){
 const rating=document.getElementById("rating").value;
 const name=document.getElementById("reviewName").value.trim()||"زائر";
 const comment=document.getElementById("reviewText").value.trim();

 if(!comment){
  alert("اكتب تعليقك أولاً");
  return;
 }

 const reviews=document.getElementById("reviews");
 const item=document.createElement("div");
 item.style.padding="10px";
 item.style.borderBottom="1px solid #63358a";

 const stars=document.createElement("div");
 stars.textContent="⭐".repeat(Number(rating));

 const author=document.createElement("b");
 author.textContent=name;

 const text=document.createElement("p");
 text.textContent=comment;

 item.append(stars,author,text);
 reviews.prepend(item);

 document.getElementById("reviewText").value="";
 alert("شكراً على تقييمك ❤️");
}
</script>
 
<script>
const originalAlert = window.alert;

window.alert = function(message){
 const translations = {
 "السلة فارغة": "Your cart is empty",
 "السلة فارغة!": "Your cart is empty!",
 "شكراً على تقييمك ❤️": "Thank you for your review ❤️",
 "شكراً على تقييمك!": "Thank you for your review!",
 "اكتب اسم Roblox وTikTok أولاً": "Please enter your Roblox and TikTok usernames first",
 "اكتب اسم Roblox وTikTok أولاً!": "Please enter your Roblox and TikTok usernames first!",
 "عذراً، الكمية المطلوبة غير متوفرة!": "Sorry, requested quantity is unavailable!"
 };

 originalAlert.call(window,
  message + (translations[message] ? "\n" + translations[message] : "")
 );
};
</script>
 
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init({
 publicKey: "s9YvGn5zlwPjVgWoH"
});

async function placeOrder(){
 const roblox=document.getElementById("robloxName").value.trim();
 const tiktok=document.getElementById("tiktokName").value.trim();

 if(!roblox || !tiktok){
  alert("اكتب اسم Roblox وTikTok أولاً!\nPlease enter your usernames first!");
  return;
 }

 const ids=Object.keys(cart);

 if(ids.length===0){
  alert("السلة فارغة!\nYour cart is empty!");
  return;
 }

 let total=0;
 let items="";

 ids.forEach(id=>{
  const f=fruits[Number(id)];
  const count=cart[id];
  items+=f[0]+" ("+f[1]+") × "+count+"\n";
  total+=f[3]*count;
 });

 try{
  await emailjs.send(
   "service_nfnzdsc",
   "template_cpsosvu",
   {
    roblox_name:roblox,
    tiktok_username:tiktok,
    order_items:items,
    total_price:total+" Robux"
   }
  );

  alert("تم إرسال طلبك بنجاح! ❤️\nYour order was sent successfully!");

  cart={};
  renderCart();

 }catch(error){
  alert("فشل إرسال الطلب، حاول مرة ثانية.\nFailed to send order. Please try again.");
 }
}
</script>
