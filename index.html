<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIR BLOX SHOP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0713;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:40px;
}
header{
 background:linear-gradient(120deg,#241044,#10091d);
 padding:25px 15px;
 text-align:center;
 border-bottom:2px solid #a855f7;
}
header h1{
 margin:0;
 color:#d8a5ff;
 font-size:30px;
}
header p{color:#ddd}
.container{
 max-width:1100px;
 margin:auto;
 padding:15px;
}
.section-title{
 color:#d8a5ff;
 font-size:23px;
 margin:25px 0 15px;
}
.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.product{
 background:#191126;
 border:1px solid #392451;
 border-radius:14px;
 padding:12px;
 text-align:center;
}
.product img{
 width:100%;
 height:125px;
 object-fit:contain;
}
.product h3{margin:8px 0}
.price{
 color:#ffd166;
 font-weight:bold;
 margin:10px;
}
button{
 border:0;
 border-radius:9px;
 padding:11px 15px;
 background:#8b3dce;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:active{transform:scale(.97)}
.cart-box,.panel{
 background:#191126;
 border:1px solid #392451;
 border-radius:14px;
 padding:16px;
 margin-top:18px;
}
input,select,textarea{
 width:100%;
 padding:13px;
 margin:8px 0;
 background:#0e0917;
 border:1px solid #543773;
 border-radius:9px;
 color:white;
 font-size:15px;
}
.full{width:100%;margin-top:10px}
.total{
 color:#ffd166;
 font-size:20px;
 font-weight:bold;
}
.reviews{
 background:#191126;
 border-radius:12px;
 padding:13px;
 margin:10px 0;
 border:1px solid #392451;
}
@media(min-width:650px){
 .products{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
<h1>🍎 MIR BLOX SHOP</h1>
<p>متجرك الأول لفواكه Blox Fruits</p>
<p>Welcome To MIR BLOX SHOP</p>
</header>

<div class="container">

<h2 class="section-title">🍇 الفواكه المتوفرة</h2>
<div class="products" id="products"></div>

<div class="cart-box">
<h2>🛒 سلة المشتريات</h2>
<div id="cartItems">السلة فارغة</div>
<p class="total" id="total">الإجمالي: 0</p>
</div>

<div class="panel">
<h2>📦 إتمام الطلب</h2>

<input id="robloxName" placeholder="اسمك في Roblox">
<input id="tiktokName" placeholder="اسمك في TikTok">

<h3>💳 اختر طريقة الدفع</h3>
<select id="payment" onchange="updatePrices()">
<option value="robux">Robux</option>
<option value="lyd">دينار ليبي</option>
</select>

<button class="full" onclick="placeOrder()">تأكيد الطلب</button>
</div>

<div class="panel" id="reviewPanel" style="display:none">
<h2>⭐ قيّم تجربتك</h2>
<select id="rating">
<option value="5">⭐⭐⭐⭐⭐ ممتاز</option>
<option value="4">⭐⭐⭐⭐ جيد جداً</option>
<option value="3">⭐⭐⭐ جيد</option>
<option value="2">⭐⭐ سيئ</option>
<option value="1">⭐ سيئ جداً</option>
</select>
<textarea id="reviewText" placeholder="اكتب رأيك في المتجر"></textarea>
<button class="full" onclick="sendReview()">إرسال التقييم</button>
<button class="full" onclick="skipReview()">تخطي</button>
</div>

<h2 class="section-title">💬 آراء الزبائن</h2>
<div id="reviewsList"></div>

</div>
 
<script>
const fruits = [
 {id:1,name:"Rocket",ar:"روكيت",img:"https://static.wikia.nocookie.net/blox-fruits/images/3/3d/Rocket_Fruit.png",robux:50,lyd:5,stock:20},
 {id:2,name:"Spin",ar:"سبين",img:"https://static.wikia.nocookie.net/blox-fruits/images/1/1c/Spin_Fruit.png",robux:75,lyd:7,stock:20},
 {id:3,name:"Blade",ar:"بليد",img:"https://static.wikia.nocookie.net/blox-fruits/images/9/9b/Blade_Fruit.png",robux:100,lyd:10,stock:20},
 {id:4,name:"Spring",ar:"سبرينغ",img:"https://static.wikia.nocookie.net/blox-fruits/images/2/2d/Spring_Fruit.png",robux:180,lyd:18,stock:20},
 {id:5,name:"Bomb",ar:"بومب",img:"https://static.wikia.nocookie.net/blox-fruits/images/8/8b/Bomb_Fruit.png",robux:220,lyd:22,stock:20},
 {id:6,name:"Smoke",ar:"سموك",img:"https://static.wikia.nocookie.net/blox-fruits/images/8/83/Smoke_Fruit.png",robux:250,lyd:25,stock:20},
 {id:7,name:"Spike",ar:"سبايك",img:"https://static.wikia.nocookie.net/blox-fruits/images/a/a0/Spike_Fruit.png",robux:300,lyd:30,stock:20},
 {id:8,name:"Flame",ar:"فليم",img:"https://static.wikia.nocookie.net/blox-fruits/images/2/2c/Flame_Fruit.png",robux:550,lyd:55,stock:20},
 {id:9,name:"Ice",ar:"آيس",img:"https://static.wikia.nocookie.net/blox-fruits/images/0/0e/Ice_Fruit.png",robux:750,lyd:75,stock:20},
 {id:10,name:"Light",ar:"لايت",img:"https://static.wikia.nocookie.net/blox-fruits/images/2/2d/Light_Fruit.png",robux:1100,lyd:110,stock:20},
 {id:11,name:"Magma",ar:"ماغما",img:"https://static.wikia.nocookie.net/blox-fruits/images/5/5c/Magma_Fruit.png",robux:1300,lyd:130,stock:20},
 {id:12,name:"Buddha",ar:"بوذا",img:"https://static.wikia.nocookie.net/blox-fruits/images/8/8d/Buddha_Fruit.png",robux:1800,lyd:180,stock:20},
 {id:13,name:"Portal",ar:"بورتال",img:"https://static.wikia.nocookie.net/blox-fruits/images/3/3e/Portal_Fruit.png",robux:2000,lyd:200,stock:20},
 {id:14,name:"Dragon",ar:"دراغون",img:"https://static.wikia.nocookie.net/blox-fruits/images/0/0e/Dragon_Fruit.png",robux:5000,lyd:500,stock:20}
];

let cart = {};

function getPrice(f){
 return document.getElementById("payment").value==="robux"
 ? f.robux+" Robux"
 : f.lyd+" دينار";
}

function renderProducts(){
 const box=document.getElementById("products");
 box.innerHTML="";

 fruits.forEach(f=>{
  box.innerHTML+=`
  <div class="product">
   <img src="${f.img}" alt="${f.name}"
    onerror="this.alt='تعذر تحميل الصورة'">
   <h3>${f.name}</h3>
   <p>${f.ar}</p>
   <div class="price">${getPrice(f)}</div>
   <p>المخزون: ${f.stock}</p>
   <button onclick="addToCart(${f.id})"
    ${f.stock<=0?"disabled":""}>
    ${f.stock<=0?"نفدت الكمية":"إضافة للسلة"}
   </button>
  </div>`;
 });
}

function addToCart(id){
 const f=fruits.find(x=>x.id===id);
 if(cart[id] && cart[id].qty>=f.stock){
  alert("الكمية غير متوفرة");
  return;
 }
 if(!cart[id])cart[id]={qty:0};
 cart[id].qty++;
 renderCart();
}

function removeFromCart(id){
 if(!cart[id])return;
 cart[id].qty--;
 if(cart[id].qty<=0)delete cart[id];
 renderCart();
}

function renderCart(){
 const box=document.getElementById("cartItems");
 let total=0;
 let html="";

 for(const id in cart){
  const f=fruits.find(x=>x.id==id);
  const qty=cart[id].qty;
  const price=document.getElementById("payment").value==="robux"
   ? f.robux:f.lyd;
  total+=price*qty;

  html+=`
  <div class="reviews">
   <b>${f.name} - ${f.ar}</b>
   <p>الكمية: ${qty}</p>
   <p>${price*qty} ${document.getElementById("payment").value==="robux"?"Robux":"دينار"}</p>
   <button onclick="removeFromCart(${id})">➖ إزالة واحدة</button>
  </div>`;
 }

 box.innerHTML=html||"السلة فارغة";
 document.getElementById("total").innerText=
 "الإجمالي: "+total+" "+
 (document.getElementById("payment").value==="robux"?"Robux":"دينار");
}

function updatePrices(){
 renderProducts();
 renderCart();
}

renderProducts();
renderCart();
</script>
</body>
</html>

<script>
async function placeOrder(){

 const roblox=document.getElementById("robloxName").value.trim();
 const tiktok=document.getElementById("tiktokName").value.trim();
 const payment=document.getElementById("payment").value;

 if(!roblox || !tiktok){
  alert("اكتب اسم Roblox وTikTok أولاً");
  return;
 }

 if(Object.keys(cart).length===0){
  alert("السلة فارغة!");
  return;
 }

 let total=0;
 let orderDetails="";

 for(const id in cart){
  const f=fruits.find(x=>x.id==id);
  const qty=cart[id].qty;
  const price=payment==="robux"?f.robux:f.lyd;

  if(qty>f.stock){
   alert("الكمية غير متوفرة: "+f.name);
   return;
  }

  total+=price*qty;
  orderDetails+=f.name+" ("+f.ar+") × "+qty+
  " = "+(price*qty)+"\n";
 }

 const currency=payment==="robux"?"Robux":"دينار ليبي";

 const message=
 "🛒 طلب جديد - MIR BLOX SHOP\n\n"+
 "Roblox: "+roblox+"\n"+
 "TikTok: "+tiktok+"\n"+
 "طريقة الدفع: "+currency+"\n\n"+
 "الفواكه:\n"+orderDetails+
 "\nالإجمالي: "+total+" "+currency;

 try{
  const response=await fetch(
   "https://formsubmit.co/ajax/mohmidalrayani@gmail.com",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "Accept":"application/json"
    },
    body:JSON.stringify({
     _subject:"طلب جديد من MIR BLOX SHOP",
     message:message
    })
   }
  );

  const result=await response.json();

  if(!response.ok || result.success===false){
   throw new Error("تعذر الإرسال");
  }

  alert("✅ تم إرسال طلبك بنجاح!");

  for(const id in cart){
   const f=fruits.find(x=>x.id==id);
   f.stock-=cart[id].qty;
  }

  cart={};
  renderProducts();
  renderCart();

  document.getElementById("reviewPanel").style.display="block";

 }catch(error){
  alert("تعذر إرسال الطلب. حاول مرة أخرى.");
 }
}
</script>
</body>
</html>

<script>
let selectedRating=0;

function setRating(value){

 selectedRating=value;

 document.getElementById("rating").value=value;

 const stars=document.querySelectorAll("#starRating span");

 stars.forEach((star,index)=>{
  star.textContent=index<value?"★":"☆";
  star.style.color=index<value?"#ffc107":"#aaa";
 });

 document.getElementById("ratingText").textContent=
 "تقييمك: "+value+" من 5 نجوم ⭐";
}

function sendReview(){

 const rating=selectedRating;
 const comment=document.getElementById("reviewText").value.trim();

 if(rating===0){
  alert("اختار عدد النجوم أولاً!");
  return;
 }

 if(!comment){
  alert("اكتب رأيك في المتجر!");
  return;
 }

 const review={
  rating:rating,
  comment:comment,
  date:new Date().toLocaleDateString("ar")
 };

 let reviews=JSON.parse(
  localStorage.getItem("mirReviews")||"[]"
 );

 reviews.unshift(review);

 localStorage.setItem(
  "mirReviews",
  JSON.stringify(reviews)
 );

 document.getElementById("reviewText").value="";
 document.getElementById("reviewPanel").style.display="none";

 selectedRating=0;
 setRating(0);

 renderReviews();

 alert("⭐ شكراً على تقييمك لمتجر MIR BLOX SHOP!");
}

function skipReview(){
 document.getElementById("reviewPanel").style.display="none";
}

function renderReviews(){

 const box=document.getElementById("reviewsList");

 const reviews=JSON.parse(
  localStorage.getItem("mirReviews")||"[]"
 );

 if(reviews.length===0){
  box.innerHTML="<p>لا توجد آراء حتى الآن ❤️</p>";
  return;
 }

 box.innerHTML="";

 reviews.forEach(r=>{

  const item=document.createElement("div");
  item.className="reviews";

  const stars="⭐".repeat(Number(r.rating));

  const title=document.createElement("b");
  title.textContent=stars;

  const comment=document.createElement("p");
  comment.textContent=r.comment;

  const date=document.createElement("small");
  date.textContent=r.date;

  item.append(title,comment,date);
  box.appendChild(item);

 });
}

renderReviews();
</script>
</body>
</html>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 query,
 orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "ضع_API_KEY",
 authDomain: "ضع_AUTH_DOMAIN",
 projectId: "ضع_PROJECT_ID",
 storageBucket: "ضع_STORAGE_BUCKET",
 messagingSenderId: "ضع_MESSAGING_SENDER_ID",
 appId: "ضع_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function savePublicReview(rating,comment){

 await addDoc(collection(db,"reviews"),{
  rating:Number(rating),
  comment:comment,
  createdAt:Date.now()
 });

}

async function loadPublicReviews(){

 const box=document.getElementById("reviewsList");

 try{

  const q=query(
   collection(db,"reviews"),
   orderBy("createdAt","desc")
  );

  const snapshot=await getDocs(q);

  box.innerHTML="";

  snapshot.forEach(doc=>{

   const r=doc.data();

   const item=document.createElement("div");
   item.className="reviews";

   const stars=document.createElement("b");
   stars.textContent="⭐".repeat(r.rating);

   const comment=document.createElement("p");
   comment.textContent=r.comment;

   item.append(stars,comment);
   box.appendChild(item);

  });

  if(snapshot.empty){
   box.textContent="لا توجد آراء حتى الآن ❤️";
  }

 }catch(error){
  box.textContent="تعذر تحميل الآراء حالياً";
 }

}

window.loadPublicReviews=loadPublicReviews;

window.savePublicReview=savePublicReview;

loadPublicReviews();
</script>
</body>
</html>

</body>
</html>
