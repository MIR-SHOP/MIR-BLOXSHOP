
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIR BLOX SHOP</title>

<style>
*{
 box-sizing:border-box;
}
body{
 margin:0;
 background:#090611;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:40px;
}
header{
 background:linear-gradient(130deg,#35145b,#10091d);
 text-align:center;
 padding:28px 12px;
 border-bottom:2px solid #a855f7;
}
header h1{
 color:#d9adff;
 font-size:29px;
 margin:0;
}
header p{
 color:#ddd;
 margin-bottom:0;
}
.container{
 width:100%;
 max-width:1100px;
 margin:auto;
 padding:15px;
}
.section-title{
 color:#d8a5ff;
 font-size:22px;
 margin:25px 0 15px;
}
.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.product{
 background:#191126;
 border:1px solid #49305f;
 border-radius:15px;
 padding:10px;
 text-align:center;
 min-width:0;
}
.product img{
 width:100%;
 height:125px;
 object-fit:contain;
}
.product h3{
 margin:8px 0;
 font-size:17px;
}
.product p{
 margin:6px 0;
 color:#c9b8d8;
}
.price{
 color:#ffd166;
 font-weight:bold;
 font-size:16px;
 margin:12px 0;
}
.stock{
 color:#9ee6a8;
 font-size:13px;
}
button{
 border:0;
 border-radius:10px;
 padding:12px;
 background:#853bc1;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{
 background:#555;
 cursor:not-allowed;
}
.cart-box,.panel{
 background:#171020;
 border:1px solid #49305f;
 border-radius:17px;
 padding:16px;
 margin-top:20px;
}
.cart-item{
 background:#21172e;
 border-radius:12px;
 padding:12px;
 margin:10px 0;
}
.cart-item img{
 width:55px;
 height:55px;
 object-fit:contain;
}
.cart-item button{
 padding:8px 12px;
 margin:4px;
}
.total{
 color:#ffd166;
 font-size:21px;
 font-weight:bold;
 margin-top:20px;
}
input,textarea{
 width:100%;
 padding:14px;
 margin:9px 0;
 background:#0d0815;
 border:1px solid #543773;
 border-radius:10px;
 color:white;
 font-size:15px;
}
textarea{
 min-height:100px;
 resize:vertical;
}
.payment-methods{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:9px;
 margin:15px 0;
}
.payment-card{
 background:#21172e;
 border:2px solid #49305f;
 border-radius:13px;
 padding:12px 5px;
 text-align:center;
 cursor:pointer;
 min-width:0;
}
.payment-card img{
 width:55px;
 height:45px;
 object-fit:contain;
}
.payment-card.active{
 border-color:#b45cff;
 background:#38204c;
}
.payment-card p{
 font-size:13px;
 margin:7px 0 0;
}
.full{
 width:100%;
 margin-top:12px;
}
.reviews{
 background:#21172e;
 padding:14px;
 border-radius:12px;
 margin:10px 0;
 border:1px solid #49305f;
}
#reviewPanel{
 display:none;
}
#starRating{
 display:flex;
 direction:ltr;
 justify-content:center;
 gap:10px;
 font-size:36px;
 margin:15px 0;
}
#starRating span{
 color:#aaa;
 cursor:pointer;
}
#ratingText{
 text-align:center;
 color:#ffd166;
}
@media(min-width:650px){
 .products{
  grid-template-columns:repeat(4,minmax(0,1fr));
 }
}
</style>
</head>

<body>

<header>
 <h1>🍎 MIR BLOX SHOP</h1>
 <p>متجرك الأول لفواكه Blox Fruits</p>
 <p>Welcome To MIR BLOX SHOP</p>
</header>

<div class="container">

 <h2 class="section-title">🍇 الفواكه المتوفرة</h2>
 <div class="products" id="products"></div>

 <div class="cart-box">
  <h2>🛒 سلة المشتريات</h2>
  <div id="cartItems">السلة فارغة</div>
  <p class="total" id="total">الإجمالي: 0</p>
 </div>

 <div class="panel">
  <h2>📦 إتمام الطلب</h2>

  <input id="robloxName"
   placeholder="اسمك في Roblox">

  <input id="tiktokName"
   placeholder="اسمك في TikTok">

  <h3>💳 اختر طريقة الدفع</h3>

  <div class="payment-methods">

   <div class="payment-card active"
    id="pay-robux"
    onclick="selectPayment('robux')">
    <div>R$</div>
    <p>Robux</p>
   </div>

   <div class="payment-card"
    id="pay-libyana"
    onclick="selectPayment('libyana')">
    <div>📱</div>
    <p>ليبيانا</p>
   </div>

   <div class="payment-card"
    id="pay-madar"
    onclick="selectPayment('madar')">
    <div>📶</div>
    <p>المدار</p>
   </div>

  </div>

  <p id="paymentInfo">الدفع بواسطة Robux</p>

  <button class="full"
   onclick="placeOrder()">
   تأكيد الطلب
  </button>
 </div>

 <div class="panel" id="reviewPanel">
  <h2>⭐ قيّم تجربتك</h2>

  <div id="starRating">
   <span onclick="setRating(1)">☆</span>
   <span onclick="setRating(2)">☆</span>
   <span onclick="setRating(3)">☆</span>
   <span onclick="setRating(4)">☆</span>
   <span onclick="setRating(5)">☆</span>
  </div>

  <p id="ratingText">اضغط على النجوم للتقييم</p>

  <textarea id="reviewText"
   placeholder="اكتب رأيك في متجرنا"></textarea>

  <button class="full" onclick="sendReview()">
   إرسال التقييم ⭐
  </button>

  <button class="full" onclick="skipReview()">
   تخطي
  </button>
 </div>

 <h2 class="section-title">💬 آراء الزبائن</h2>
 <div id="reviewsList"></div>

<!-- مكان تركيب الأجزاء 2 و3 و4 و5 -->

</div>

<!-- نهاية الملف: لا تحذف هذين السطرين -->
 
<script>
const fruits = [
{id:1,name:"Rocket",ar:"روكيت",img:"https://static.wikia.nocookie.net/blox-fruits/images/3/3d/Rocket_Fruit.png",robux:50,libyana:5,madar:5,stock:20},
{id:2,name:"Spin",ar:"سبين",img:"https://static.wikia.nocookie.net/blox-fruits/images/1/1c/Spin_Fruit.png",robux:75,libyana:7,madar:7,stock:20},
{id:3,name:"Blade",ar:"بليد",img:"https://static.wikia.nocookie.net/blox-fruits/images/9/9b/Blade_Fruit.png",robux:100,libyana:10,madar:10,stock:20},
{id:4,name:"Spring",ar:"سبرينغ",img:"https://static.wikia.nocookie.net/blox-fruits/images/2/2d/Spring_Fruit.png",robux:180,libyana:18,madar:18,stock:20},
{id:5,name:"Bomb",ar:"بومب",img:"https://static.wikia.nocookie.net/blox-fruits/images/8/8b/Bomb_Fruit.png",robux:220,libyana:22,madar:22,stock:20},
{id:6,name:"Smoke",ar:"سموك",img:"https://static.wikia.nocookie.net/blox-fruits/images/8/83/Smoke_Fruit.png",robux:250,libyana:25,madar:25,stock:20},
{id:7,name:"Spike",ar:"سبايك",img:"https://static.wikia.nocookie.net/blox-fruits/images/a/a0/Spike_Fruit.png",robux:300,libyana:30,madar:30,stock:20},
{id:8,name:"Flame",ar:"فليم",img:"https://static.wikia.nocookie.net/blox-fruits/images/2/2c/Flame_Fruit.png",robux:550,libyana:55,madar:55,stock:20},
{id:9,name:"Ice",ar:"آيس",img:"https://static.wikia.nocookie.net/blox-fruits/images/0/0e/Ice_Fruit.png",robux:750,libyana:75,madar:75,stock:20},
{id:10,name:"Light",ar:"لايت",img:"https://static.wikia.nocookie.net/blox-fruits/images/2/2d/Light_Fruit.png",robux:1100,libyana:110,madar:110,stock:20},
{id:11,name:"Magma",ar:"ماغما",img:"https://static.wikia.nocookie.net/blox-fruits/images/5/5c/Magma_Fruit.png",robux:1300,libyana:130,madar:130,stock:20},
{id:12,name:"Buddha",ar:"بوذا",img:"https://static.wikia.nocookie.net/blox-fruits/images/8/8d/Buddha_Fruit.png",robux:1800,libyana:180,madar:180,stock:20},
{id:13,name:"Portal",ar:"بورتال",img:"https://static.wikia.nocookie.net/blox-fruits/images/3/3e/Portal_Fruit.png",robux:2000,libyana:200,madar:200,stock:20},
{id:14,name:"Dragon",ar:"دراغون",img:"https://static.wikia.nocookie.net/blox-fruits/images/0/0e/Dragon_Fruit.png",robux:5000,libyana:500,madar:500,stock:20}
];

let cart={};
let paymentMethod="robux";

function selectPayment(method){
 paymentMethod=method;

 document.querySelectorAll(".payment-card").forEach(card=>{
  card.classList.remove("active");
 });

 document.getElementById("pay-"+method).classList.add("active");

 const names={
  robux:"الدفع بواسطة Robux",
  libyana:"الدفع بواسطة رصيد ليبيانا",
  madar:"الدفع بواسطة رصيد المدار"
 };

 document.getElementById("paymentInfo").textContent=names[method];

 renderProducts();
 renderCart();
}

function priceOf(f){
 return f[paymentMethod];
}

function currency(){
 return paymentMethod==="robux"?"Robux":"دينار ليبي";
}

function renderProducts(){
 const box=document.getElementById("products");
 box.innerHTML="";

 fruits.forEach(f=>{
  const card=document.createElement("div");
  card.className="product";

  const img=document.createElement("img");
  img.src=f.img;
  img.alt=f.name+" fruit";
  img.onerror=()=>{img.alt="تعذر تحميل صورة "+f.name;};

  const name=document.createElement("h3");
  name.textContent=f.name;

  const arabic=document.createElement("p");
  arabic.textContent=f.ar;

  const price=document.createElement("div");
  price.className="price";
  price.textContent=priceOf(f)+" "+currency();

  const stock=document.createElement("p");
  stock.className="stock";
  stock.textContent=f.stock>0?"المخزون: "+f.stock:"نفدت الكمية";

  const btn=document.createElement("button");
  btn.textContent=f.stock>0?"إضافة للسلة":"نفدت الكمية";
  btn.disabled=f.stock<=0;
  btn.onclick=()=>addToCart(f.id);

  card.append(img,name,arabic,price,stock,btn);
  box.appendChild(card);
 });
}

function addToCart(id){
 const f=fruits.find(x=>x.id===id);

 if(!cart[id])cart[id]={qty:0};

 if(cart[id].qty>=f.stock){
  alert("الكمية غير متوفرة");
  return;
 }

 cart[id].qty++;
 renderCart();
}

function changeQty(id,change){
 const f=fruits.find(x=>x.id===id);
 if(!cart[id])return;

 const next=cart[id].qty+change;

 if(next>f.stock){
  alert("المخزون غير كافٍ");
  return;
 }

 if(next<=0){
  delete cart[id];
 }else{
  cart[id].qty=next;
 }

 renderCart();
}

function removeItem(id){
 delete cart[id];
 renderCart();
}

function renderCart(){
 const box=document.getElementById("cartItems");
 let total=0;
 box.innerHTML="";

 for(const id in cart){
  const f=fruits.find(x=>x.id==id);
  const qty=cart[id].qty;
  const sum=priceOf(f)*qty;
  total+=sum;

  const item=document.createElement("div");
  item.className="cart-item";

  const title=document.createElement("b");
  title.textContent=f.name+" - "+f.ar;

  const quantity=document.createElement("p");
  quantity.textContent="الكمية: "+qty;

  const price=document.createElement("p");
  price.textContent="السعر: "+sum+" "+currency();

  const minus=document.createElement("button");
  minus.textContent="➖";
  minus.onclick=()=>changeQty(id,-1);

  const plus=document.createElement("button");
  plus.textContent="➕";
  plus.onclick=()=>changeQty(id,1);

  const remove=document.createElement("button");
  remove.textContent="حذف";
  remove.onclick=()=>removeItem(id);

  item.append(title,quantity,price,minus,plus,remove);
  box.appendChild(item);
 }

 if(Object.keys(cart).length===0){
  box.textContent="السلة فارغة 🛒";
 }

 document.getElementById("total").textContent=
 "الإجمالي: "+total+" "+currency();
}

function updatePrices(){
 renderProducts();
 renderCart();
}

renderProducts();
renderCart();
</script>
 
<script>
async function placeOrder() {
  const roblox = document.getElementById("robloxName").value.trim();
  const tiktok = document.getElementById("tiktokName").value.trim();
  const ids = Object.keys(cart);

  if (!roblox || !tiktok) {
    alert("اكتب اسم Roblox وTikTok أولاً!");
    return;
  }

  if (ids.length === 0) {
    alert("السلة فارغة!");
    return;
  }

  for (const id of ids) {
    const fruit = fruits.find(f => f.id === id);
    if (!fruit || fruit.stock < cart[id]) {
      alert("الكمية المطلوبة غير متوفرة: " + (fruit ? fruit.name : id));
      return;
    }
  }

  const methodNames = {
    robux: "Robux",
    libyana: "رصيد ليبيانا",
    madar: "رصيد المدار"
  };

  const method = methodNames[paymentMethod] || paymentMethod;
  let total = 0;
  let details = "";

  ids.forEach(id => {
    const fruit = fruits.find(f => f.id === id);
    const qty = cart[id];
    const price = priceOf(fruit);
    total += price * qty;
    details += `${fruit.name} × ${qty} = ${price * qty} ${currency()}\n`;
  });

  const orderMessage =
`طلب جديد من MIR BLOX SHOP

اسم Roblox: ${roblox}
اسم TikTok: ${tiktok}

طريقة الدفع: ${method}

المنتجات:
${details}

الإجمالي: ${total} ${currency()}`;

  const orderButton = document.getElementById("orderButton");
  if (orderButton) orderButton.disabled = true;

  try {
    const response = await fetch(
      "https://formsubmit.co/ajax/mohmidalrayani@gmail.com",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          _subject: "طلب جديد - MIR BLOX SHOP",
          message: orderMessage,
          _captcha: "false"
        })
      }
    );

    const result = await response.json();

    if (!response.ok || result.success === false ||
        result.success === "false") {
      throw new Error("لم يتم قبول الطلب");
    }

    ids.forEach(id => {
      const fruit = fruits.find(f => f.id === id);
      fruit.stock -= cart[id];
    });

    cart = {};
    renderProducts();
    renderCart();

    alert("تم إرسال الطلب! شكراً لطلبك ❤️");

    document.getElementById("reviewPanel").style.display = "block";

  } catch (error) {
    alert("تعذر إرسال الطلب. حاول مرة ثانية.");
  } finally {
    if (orderButton) orderButton.disabled = false;
  }
}
</script>
 
<script>
let selectedRating = 0;

function setRating(value) {
  selectedRating = value;

  const stars = document.querySelectorAll("#starRating span");

  stars.forEach((star, index) => {
    star.style.color = index < value ? "#ffc107" : "#777";
  });

  document.getElementById("ratingText").textContent =
    value + " من 5 نجوم";
}

function renderReviews() {
  const area = document.getElementById("reviewsList");
  if (!area) return;

  const reviews = JSON.parse(
    localStorage.getItem("mirReviews") || "[]"
  );

  area.innerHTML = "";

  reviews.slice().reverse().forEach(review => {
    const item = document.createElement("div");
    item.style.cssText =
      "background:#21172e;padding:12px;margin:10px 0;border-radius:12px";

    const stars = document.createElement("div");
    stars.textContent = "⭐".repeat(review.rating);

    const name = document.createElement("b");
    name.textContent = review.name;

    const message = document.createElement("p");
    message.textContent = review.message;

    item.append(stars, name, message);
    area.appendChild(item);
  });
}

function sendReview() {
  if (!selectedRating) {
    alert("اختار عدد النجوم أولاً!");
    return;
  }

  const message = document.getElementById("reviewMessage").value.trim();

  if (!message) {
    alert("اكتب رأيك في المتجر!");
    return;
  }

  const reviews = JSON.parse(
    localStorage.getItem("mirReviews") || "[]"
  );

  reviews.push({
    rating: selectedRating,
    message: message,
    name: "زبون المتجر"
  });

  localStorage.setItem("mirReviews", JSON.stringify(reviews));

  alert("شكراً على تقييمك ❤️");

  document.getElementById("reviewPanel").style.display = "none";
  document.getElementById("reviewMessage").value = "";
  selectedRating = 0;

  renderReviews();
}

function skipReview() {
  document.getElementById("reviewPanel").style.display = "none";
}

document.addEventListener("DOMContentLoaded", () => {
  const starsArea = document.getElementById("starRating");

  if (starsArea) {
    starsArea.innerHTML = "";

    for (let i = 1; i <= 5; i++) {
      const star = document.createElement("span");
      star.textContent = "★";
      star.style.cssText =
        "font-size:38px;color:#777;cursor:pointer;padding:5px";

      star.addEventListener("click", () => setRating(i));
      starsArea.appendChild(star);
    }
  }

  renderReviews();
});
</script>
 
</body>
  </html>
