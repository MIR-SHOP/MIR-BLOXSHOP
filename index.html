<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIR BLOX SHOP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0713;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:40px;
}
header{
 background:linear-gradient(120deg,#241044,#10091d);
 padding:25px 15px;
 text-align:center;
 border-bottom:2px solid #a855f7;
}
header h1{
 margin:0;
 color:#d8a5ff;
 font-size:30px;
}
header p{color:#ddd}
.container{
 max-width:1100px;
 margin:auto;
 padding:15px;
}
.section-title{
 color:#d8a5ff;
 font-size:23px;
 margin:25px 0 15px;
}
.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.product{
 background:#191126;
 border:1px solid #392451;
 border-radius:14px;
 padding:12px;
 text-align:center;
}
.product img{
 width:100%;
 height:125px;
 object-fit:contain;
}
.product h3{margin:8px 0}
.price{
 color:#ffd166;
 font-weight:bold;
 margin:10px;
}
button{
 border:0;
 border-radius:9px;
 padding:11px 15px;
 background:#8b3dce;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
button:active{transform:scale(.97)}
.cart-box,.panel{
 background:#191126;
 border:1px solid #392451;
 border-radius:14px;
 padding:16px;
 margin-top:18px;
}
input,select,textarea{
 width:100%;
 padding:13px;
 margin:8px 0;
 background:#0e0917;
 border:1px solid #543773;
 border-radius:9px;
 color:white;
 font-size:15px;
}
.full{width:100%;margin-top:10px}
.total{
 color:#ffd166;
 font-size:20px;
 font-weight:bold;
}
.reviews{
 background:#191126;
 border-radius:12px;
 padding:13px;
 margin:10px 0;
 border:1px solid #392451;
}
@media(min-width:650px){
 .products{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
<h1>🍎 MIR BLOX SHOP</h1>
<p>متجرك الأول لفواكه Blox Fruits</p>
<p>Welcome To MIR BLOX SHOP</p>
</header>

<div class="container">

<h2 class="section-title">🍇 الفواكه المتوفرة</h2>
<div class="products" id="products"></div>

<div class="cart-box">
<h2>🛒 سلة المشتريات</h2>
<div id="cartItems">السلة فارغة</div>
<p class="total" id="total">الإجمالي: 0</p>
</div>

<div class="panel">
<h2>📦 إتمام الطلب</h2>

<input id="robloxName" placeholder="اسمك في Roblox">
<input id="tiktokName" placeholder="اسمك في TikTok">

<h3>💳 اختر طريقة الدفع</h3>
<select id="payment" onchange="updatePrices()">
<option value="robux">Robux</option>
<option value="lyd">دينار ليبي</option>
</select>

<button class="full" onclick="placeOrder()">تأكيد الطلب</button>
</div>

<div class="panel" id="reviewPanel" style="display:none">
<h2>⭐ قيّم تجربتك</h2>
<select id="rating">
<option value="5">⭐⭐⭐⭐⭐ ممتاز</option>
<option value="4">⭐⭐⭐⭐ جيد جداً</option>
<option value="3">⭐⭐⭐ جيد</option>
<option value="2">⭐⭐ سيئ</option>
<option value="1">⭐ سيئ جداً</option>
</select>
<textarea id="reviewText" placeholder="اكتب رأيك في المتجر"></textarea>
<button class="full" onclick="sendReview()">إرسال التقييم</button>
<button class="full" onclick="skipReview()">تخطي</button>
</div>

<h2 class="section-title">💬 آراء الزبائن</h2>
<div id="reviewsList"></div>

</div>
</body>
</html>
