
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIR BLOX SHOP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0712;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:25px 10px;
 background:linear-gradient(135deg,#240b42,#10091b);
 border-bottom:2px solid #9b45ff;
}
header h1{color:#c58aff;margin:0}
header p{color:#ddd}
.container{padding:15px;max-width:1100px;margin:auto}
input,button{
 font-family:Arial;
 border:0;
 border-radius:10px;
 padding:12px;
}
input{
 width:100%;
 background:#21172e;
 color:white;
 margin:7px 0;
}
button{
 background:#8b35d9;
 color:white;
 cursor:pointer;
}
button:disabled{background:#555;cursor:not-allowed}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:12px;
}
.card{
 background:#191124;
 border:1px solid #63358a;
 border-radius:14px;
 padding:12px;
 text-align:center;
}
.card img{
 width:100%;
 height:105px;
 object-fit:contain;
}
.card h3{margin:8px 0}
.price{color:#d6a4ff}
.stock{color:#8ee6a5}
.out{color:#ff7777}
.qty{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:12px;
 margin:10px 0;
}
.qty button{padding:7px 13px}
.panel{
 background:#191124;
 border:1px solid #63358a;
 border-radius:14px;
 padding:15px;
 margin-top:20px;
}
h2{color:#c58aff}
</style>
</head>
<body>

<header>
<h1>👑 MIR BLOX SHOP</h1>
<p>متجرك الأول لفواكه Blox Fruits</p>
</header>

<div class="container">
<input id="search" placeholder="🔎 ابحث عن فاكهة...">
<div class="products" id="products"></div>

<div class="panel">
<h2>🛒 سلة طلبك</h2>
<div id="cartItems">السلة فارغة</div>
<h3 id="total">المجموع: 0 Robux</h3>
</div>
</div>
</body>
  </html>
